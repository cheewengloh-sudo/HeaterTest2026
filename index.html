<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>QRF 蓝牙温控面板</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      padding: 40px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 30px;
    }

    button {
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #2980b9;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .data-row {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
    }

    .label {
      font-weight: bold;
      flex: 0 0 180px;
      color: #555;
    }

    .value {
      font-family: monospace;
      color: #2c3e50;
    }

    .input-row {
      margin-top: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-actions {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
      margin-top: 25px;
    }

    input[type="text"] {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      width: 140px;
    }

    #btnConnect {
      width: 100%;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #aaa;
    }

    .status-info {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      background-color: #f8f9fa;
      border-left: 4px solid #3498db;
    }

    .debug-container {
      margin-top: 20px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .debug-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    #debugLog {
      height: 150px;
      overflow-y: auto;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
    }

    .debug-entry {
      margin-bottom: 5px;
      padding-bottom: 5px;
      border-bottom: 1px solid #eee;
      font-family: monospace;
      font-size: 11px;
    }

    .debug-time {
      color: #888;
      margin-right: 8px;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-connected {
      background-color: #2ecc71;
    }

    .status-disconnected {
      background-color: #e74c3c;
    }

    .connection-status {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      padding: 8px 12px;
      background-color: #f8f9fa;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div style="text-align:right; margin-bottom:10px;">
    <select id="langSelect" onchange="switchLang(this.value)">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </div>

  <h1 id="mainTitle">QRF 蓝牙温控面板</h1>

  <div class="container">
    <div class="connection-status">
      <span id="statusIndicator" class="status-indicator status-disconnected"></span>
      <span id="connectionStatusText">Disconnected</span>
    </div>

    <div class="data-row">
      <label class="label" id="labelCurrentTemp">当前温度：</label>
      <span class="value" id="currentTemp">--</span>
    </div>
    <div class="data-row">
      <label class="label" id="labelTargetTemp">目标温度：</label>
      <span class="value" id="targetTemp">--</span>
    </div>
    <div class="data-row">
      <label class="label" id="labelBatteryLevel">电池电量：</label>
      <span class="value" id="batteryLevel">--</span>
    </div>

    <div style="margin: 30px 0;">
      <canvas id="tempChart" height="180"></canvas>
    </div>

    <div class="input-row">
      <input type="text" id="tempInput" maxlength="8" placeholder="设置温度">
      <button id="btnWriteTemp" onclick="writeTargetTemp()">写入温度</button>
    </div>

    <div id="fileStatus" class="status-info">
      Ready to connect
    </div>

    <div class="debug-container">
      <div class="debug-header">
        <h3 id="debugTitle">Debug Information</h3>
        <button id="btnClearDebug" onclick="clearDebugLog()" style="font-size: 12px;">Clear Log</button>
      </div>
      <div id="debugLog"></div>
    </div>

    <div class="input-actions">
      <div style="margin-top: 20px; text-align: center;">
        <button id="btnConnect" onclick="connectBluetooth()">Connect Bluetooth</button>
      </div>
    </div>
  </div>

  <div class="footer" id="footerText">
    QRF 控制系统 © 2025
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script>
    const LANGS = {
      zh: {
        title: "蓝牙温控面板",
        currentTemp: "当前温度：",
        targetTemp: "目标温度：",
        batteryLevel: "电池电量：",
        setTemp: "设置温度",
        writeTemp: "设置温度",
        connect: "连接蓝牙设备",
        footer: "QRF 控制系统 © 2025",
        alert: "请输入合法的温度（0.0 ~ 99.9°C）",
        notConnected: "尚未连接蓝牙或未发现写特性",
        debugTitle: "调试信息",
        clearLog: "清空日志"
      },
      en: {
        title: "Bluetooth Thermostat Panel",
        currentTemp: "Current Temperature:",
        targetTemp: "Target Temperature:",
        batteryLevel: "Battery Level:",
        setTemp: "Set Temperature",
        writeTemp: "Set Temperature",
        connect: "Connect Bluetooth",
        footer: "QRF Control System © 2025",
        alert: "Please enter a valid temperature (0.0 ~ 99.9°C)",
        notConnected: "Not connected or characteristic not found",
        debugTitle: "Debug Information",
        clearLog: "Clear Log"
      }
    };
    
    let currentLang = 'en';
    let writeCharacteristic = null;
    let isConnected = false;
    let connectionStartTime = null;
    let device = null;

    // 🔥 CRITICAL FIX: Use UPPERCASE UUIDs to match firmware
    const serviceUUID = 'ABCD0000-0000-1000-8000-00805F9B0131';
    const writeUUID = 'ABCD0001-0000-1000-8000-00805F9B0131';
    
    // All characteristics in UPPERCASE
    const notifyUUIDs = [
      'ABCD0002-0000-1000-8000-00805F9B0131',  // temperature
      'ABCD0004-0000-1000-8000-00805F9B0131',  // target temperature
      'ABCD2A19-0000-1000-8000-00805F9B0131',  // battery
      'ABCD1001-0000-1000-8000-00805F9B0131',  // file transfer
      'ABCD1002-0000-1000-8000-00805F9B0131'   // file list
    ];

    const notifyDisplayMap = {
      'ABCD0002-0000-1000-8000-00805F9B0131': 'currentTemp',
      'ABCD0004-0000-1000-8000-00805F9B0131': 'targetTemp',
      'ABCD2A19-0000-1000-8000-00805F9B0131': 'batteryLevel'
    };

    function switchLang(lang) {
      currentLang = lang;
      document.title = LANGS[lang].title;
      document.getElementById('mainTitle').textContent = LANGS[lang].title;
      document.getElementById('labelCurrentTemp').textContent = LANGS[lang].currentTemp;
      document.getElementById('labelTargetTemp').textContent = LANGS[lang].targetTemp;
      document.getElementById('labelBatteryLevel').textContent = LANGS[lang].batteryLevel;
      document.getElementById('tempInput').placeholder = LANGS[lang].setTemp;
      document.getElementById('btnWriteTemp').textContent = LANGS[lang].writeTemp;
      document.getElementById('btnConnect').textContent = LANGS[lang].connect;
      document.getElementById('footerText').textContent = LANGS[lang].footer;
      document.getElementById('debugTitle').textContent = LANGS[lang].debugTitle;
      document.getElementById('btnClearDebug').textContent = LANGS[lang].clearLog;
      document.getElementById('langSelect').value = lang;
      
      const statusText = document.getElementById('connectionStatusText');
      if (statusText) {
        statusText.textContent = isConnected ? LANGS[lang].connected : LANGS[lang].disconnected;
      }
    }

    function addDebugLog(message) {
      const debugLog = document.getElementById('debugLog');
      const now = new Date();
      const timeString = now.toTimeString().split(' ')[0] + '.' + now.getMilliseconds().toString().padStart(3, '0');
      const logEntry = document.createElement('div');
      logEntry.className = 'debug-entry';
      logEntry.innerHTML = `<span class="debug-time">[${timeString}]</span> ${message}`;
      debugLog.appendChild(logEntry);
      debugLog.scrollTop = debugLog.scrollHeight;
      console.log(`[${timeString}] ${message}`);
    }

    function clearDebugLog() {
      document.getElementById('debugLog').innerHTML = '';
      addDebugLog('Debug log cleared');
    }

    function updateConnectionStatus(connected) {
      isConnected = connected;
      const indicator = document.getElementById('statusIndicator');
      const statusText = document.getElementById('connectionStatusText');
      
      if (connected) {
        indicator.className = 'status-indicator status-connected';
        statusText.textContent = LANGS[currentLang].connected;
        addDebugLog(`✅✅✅ CONNECTION SUCCESSFUL ✅✅✅`);
      } else {
        indicator.className = 'status-indicator status-disconnected';
        statusText.textContent = LANGS[currentLang].disconnected;
        addDebugLog(`❌ DISCONNECTED`);
      }
    }

    function parseFixedPointTemp(value) {
      const raw = value.getUint8(0) | (value.getUint8(1) << 8);
      return raw * 0.1;
    }

    async function connectBluetooth() {
      addDebugLog('========================================');
      addDebugLog('Connecting with UPPERCASE UUIDs');
      addDebugLog(`Service UUID: ${serviceUUID}`);
      addDebugLog(`Write UUID: ${writeUUID}`);
      addDebugLog('========================================');
      
      try {
        addDebugLog('Step 1: Requesting Bluetooth device...');
        device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [serviceUUID]
        });

        addDebugLog(`✅ Device found: ${device.name || 'Unknown'}`);
        
        addDebugLog('Step 2: Connecting to GATT server...');
        connectionStartTime = Date.now();
        const server = await device.gatt.connect();
        addDebugLog(`✅ GATT connected`);
        
        addDebugLog('Step 3: Getting primary service...');
        const service = await server.getPrimaryService(serviceUUID);
        addDebugLog(`✅ Service found: ${serviceUUID}`);
        
        addDebugLog('Step 4: Getting all characteristics...');
        const characteristics = await service.getCharacteristics();
        addDebugLog(`Found ${characteristics.length} characteristics`);
        
        // List all found characteristics for debugging
        for (const char of characteristics) {
          addDebugLog(`  Found: ${char.uuid}`);
        }
        
        let writeFound = false;
        
        for (const char of characteristics) {
          const uuid = char.uuid;
          
          if (uuid.toUpperCase() === writeUUID.toUpperCase()) {
            writeCharacteristic = char;
            writeFound = true;
            addDebugLog(`✅ WRITE characteristic FOUND: ${uuid}`);
            continue;
          }
          
          if (notifyUUIDs.map(u => u.toUpperCase()).includes(uuid.toUpperCase())) {
            addDebugLog(`🔔 Enabling notifications for: ${uuid}`);
            try {
              await char.startNotifications();
              addDebugLog(`✅ Notifications enabled for ${uuid}`);
              
              char.addEventListener('characteristicvaluechanged', (event) => {
                const value = event.target.value;
                const uuid = event.target.uuid;
                const spanId = notifyDisplayMap[uuid.toUpperCase()];
                let parsed = '';

                switch (uuid.toUpperCase()) {
                  case 'ABCD0002-0000-1000-8000-00805F9B0131':
                    const tempVal = parseFixedPointTemp(value);
                    parsed = tempVal.toFixed(1) + ' °C';
                    addTempPoint(tempVal);
                    addDebugLog(`🌡️ Temperature: ${parsed}`);
                    break;
                  case 'ABCD0004-0000-1000-8000-00805F9B0131':
                    parsed = parseFixedPointTemp(value).toFixed(1) + ' °C';
                    addDebugLog(`🎯 Target: ${parsed}`);
                    break;
                  case 'ABCD2A19-0000-1000-8000-00805F9B0131':
                    parsed = value.getUint8(0) + ' %';
                    addDebugLog(`🔋 Battery: ${parsed}`);
                    break;
                }

                if (spanId) {
                  document.getElementById(spanId).textContent = parsed;
                }
              });
            } catch (err) {
              addDebugLog(`❌ Failed to enable notifications for ${uuid}: ${err}`);
            }
          }
        }
        
        if (!writeFound) {
          addDebugLog(`❌ ERROR: Write characteristic not found!`);
          updateConnectionStatus(false);
          return;
        }
        
        addDebugLog('========================================');
        addDebugLog('✅✅✅ CONNECTION FULLY ESTABLISHED ✅✅✅');
        addDebugLog('All characteristics should now work');
        addDebugLog('========================================');
        
        updateConnectionStatus(true);
        
        // Time sync
        addDebugLog('Syncing time to device...');
        try {
          const now = new Date();
          const year = now.getFullYear() - 2000;
          const month = now.getMonth() + 1;
          const day = now.getDate();
          const hours = now.getHours();
          const minutes = now.getMinutes();
          const seconds = now.getSeconds();
          const timeBuffer = new Uint8Array([year, month, day, hours, minutes, seconds]);
          await writeCharacteristic.writeValue(timeBuffer);
          addDebugLog(`✅ Time synced: ${year+2000}-${month}-${day} ${hours}:${minutes}:${seconds}`);
        } catch (err) {
          addDebugLog(`⚠️ Time sync failed: ${err}`);
        }
        
        // Monitor disconnection
        device.addEventListener('gattserverdisconnected', () => {
          const duration = connectionStartTime ? ((Date.now() - connectionStartTime) / 1000).toFixed(1) : '?';
          addDebugLog(`🔌 DISCONNECTED after ${duration}s`);
          updateConnectionStatus(false);
        });
        
      } catch (error) {
        addDebugLog(`❌ CONNECTION FAILED: ${error.message || error}`);
        updateConnectionStatus(false);
      }
    }

    async function writeTargetTemp() {
      const inputStr = document.getElementById('tempInput').value.trim();
      const inputNum = parseFloat(inputStr);

      if (isNaN(inputNum) || inputNum < 0 || inputNum > 99.9) {
        alert(LANGS[currentLang].alert);
        addDebugLog(`Invalid temperature: ${inputStr}`);
        return;
      }

      const intValue = Math.round(inputNum * 10);
      const encodedStr = intValue.toString().padStart(3, '0');
      const encoder = new TextEncoder();
      const data = encoder.encode(encodedStr);

      if (writeCharacteristic) {
        try {
          await writeCharacteristic.writeValue(data);
          addDebugLog(`✅ Temperature set: ${inputNum}°C`);
        } catch (err) {
          addDebugLog(`❌ Write failed: ${err}`);
        }
      } else {
        alert(LANGS[currentLang].notConnected);
        addDebugLog("Cannot write: not connected");
      }
    }

    // Chart setup
    let tempChart = null;
    let tempData = {
      labels: [],
      datasets: [{
        label: 'Temperature (°C)',
        data: [], 
        borderColor: '#3498db',
        backgroundColor: 'rgba(52,152,219,0.08)',
        tension: 0.2,
        pointRadius: 2,
        fill: true
      }]
    };

    function initTempChart() {
      const ctx = document.getElementById('tempChart').getContext('2d');
      tempChart = new Chart(ctx, {
        type: 'line',
        data: tempData,
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { type: 'time', time: { unit: 'minute' }, title: { display: true, text: 'Time' } },
            y: { title: { display: true, text: 'Temperature (°C)' }, suggestedMin: 0, suggestedMax: 50 }
          }
        }
      });
    }

    function addTempPoint(temp) {
      if (!tempChart) return;
      const now = new Date();
      tempData.labels.push(now);
      tempData.datasets[0].data.push(temp);
      if (tempData.labels.length > 60) {
        tempData.labels.shift();
        tempData.datasets[0].data.shift();
      }
      tempChart.update();
    }

    switchLang(currentLang);
    window.addEventListener('DOMContentLoaded', () => {
      initTempChart();
      addDebugLog('=== Page Loaded ===');
      addDebugLog(`⚠️ Using UPPERCASE UUIDs to match firmware`);
      addDebugLog(`Service: ${serviceUUID}`);
      addDebugLog(`Write: ${writeUUID}`);
    });
  </script>
</body>
</html>
