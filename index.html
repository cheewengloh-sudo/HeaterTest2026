<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>QRF 蓝牙温控面板 - MINIMAL TEST</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      padding: 40px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 30px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      padding: 30px;
    }

    button {
      padding: 10px 20px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #2980b9;
    }

    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }

    .data-row {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 16px;
    }

    .label {
      font-weight: bold;
      flex: 0 0 180px;
      color: #555;
    }

    .value {
      font-family: monospace;
      color: #2c3e50;
    }

    .input-row {
      margin-top: 25px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-actions {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 18px;
      margin-top: 25px;
    }

    input[type="text"] {
      padding: 8px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      width: 140px;
    }

    #btnConnect {
      width: 100%;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: #aaa;
    }

    .test-mode-banner {
      background-color: #e74c3c;
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .status-info {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      background-color: #f8f9fa;
      border-left: 4px solid #3498db;
    }
    
    .status-warning {
      margin-top: 10px;
      padding: 10px;
      border-radius: 6px;
      background-color: #fef5e7;
      border-left: 4px solid #f39c12;
    }

    .debug-container {
      margin-top: 20px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .debug-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    #debugLog {
      height: 150px;
      overflow-y: auto;
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
    }

    .debug-entry {
      margin-bottom: 5px;
      padding-bottom: 5px;
      border-bottom: 1px solid #eee;
      font-family: monospace;
      font-size: 11px;
    }

    .debug-time {
      color: #888;
      margin-right: 8px;
    }

    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-connected {
      background-color: #2ecc71;
    }

    .status-disconnected {
      background-color: #e74c3c;
    }

    .connection-status {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      padding: 8px 12px;
      background-color: #f8f9fa;
      border-radius: 6px;
      font-size: 14px;
    }

    .disabled-feature {
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="test-mode-banner">
    🧪 MINIMAL TEST MODE: ONLY Temperature Characteristic Enabled 🧪
  </div>

  <div style="text-align:right; margin-bottom:10px;">
    <select id="langSelect" onchange="switchLang(this.value)">
      <option value="en">English</option>
      <option value="zh">中文</option>
    </select>
  </div>

  <h1 id="mainTitle">QRF 蓝牙测试 - 最小特性</h1>

  <div class="container">
    <div class="connection-status">
      <span id="statusIndicator" class="status-indicator status-disconnected"></span>
      <span id="connectionStatusText">Disconnected</span>
    </div>

    <div class="data-row">
      <label class="label" id="labelCurrentTemp">当前温度：</label>
      <span class="value" id="currentTemp">--</span>
    </div>
    
    <!-- DISABLED FEATURES (grayed out) -->
    <div class="data-row disabled-feature">
      <label class="label" id="labelTargetTemp">目标温度：</label>
      <span class="value" id="targetTemp">-- (disabled)</span>
    </div>
    
    <div class="data-row disabled-feature">
      <label class="label" id="labelBatteryLevel">电池电量：</label>
      <span class="value" id="batteryLevel">-- (disabled)</span>
    </div>

    <div style="margin: 30px 0;">
      <canvas id="tempChart" height="180"></canvas>
    </div>

    <div class="input-row">
      <input type="text" id="tempInput" maxlength="8" placeholder="设置温度">
      <button id="btnWriteTemp" onclick="writeTargetTemp()">写入温度</button>
    </div>
    
    <div class="input-row disabled-feature">
      <button id="btnDownloadCSV" disabled>下载日志 (disabled)</button>
    </div>

    <div id="fileStatus" class="status-info">
      📊 TEST MODE: Only temperature notifications enabled
    </div>

    <div class="debug-container">
      <div class="debug-header">
        <h3 id="debugTitle">Debug Information</h3>
        <button id="btnClearDebug" onclick="clearDebugLog()" style="font-size: 12px;">Clear Log</button>
      </div>
      <div id="debugLog"></div>
    </div>

    <div class="input-actions">
      <div style="margin-top: 20px; text-align: center;">
        <button id="btnConnect" onclick="connectBluetooth()">Connect Bluetooth</button>
      </div>
    </div>
  </div>

  <div class="footer" id="footerText">
    QRF Test Mode - Only Temperature Characteristic Active
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script>
    const LANGS = {
      zh: {
        title: "QRF 蓝牙测试 - 最小特性",
        currentTemp: "当前温度：",
        targetTemp: "目标温度：",
        batteryLevel: "电池电量：",
        setTemp: "设置温度",
        writeTemp: "写入温度",
        connect: "连接蓝牙",
        footer: "测试模式 - 仅温度特性",
        alert: "请输入合法的温度（0.0 ~ 99.9°C）",
        notConnected: "未连接",
        debugTitle: "调试信息",
        clearLog: "清空日志"
      },
      en: {
        title: "QRF Bluetooth Test - Minimal",
        currentTemp: "Current Temperature:",
        targetTemp: "Target Temperature:",
        batteryLevel: "Battery Level:",
        setTemp: "Set Temperature",
        writeTemp: "Set Temperature",
        connect: "Connect Bluetooth",
        footer: "Test Mode - Temperature Only",
        alert: "Enter valid temperature (0.0 ~ 99.9°C)",
        notConnected: "Not connected",
        debugTitle: "Debug Information",
        clearLog: "Clear Log"
      }
    };
    
    let currentLang = 'en';
    let writeCharacteristic = null;
    let isConnected = false;
    let connectionStartTime = null;
    let temperatureUpdateCount = 0;

    const serviceUUID = 'abcd0000-0000-1000-8000-00805f9b0131';
    const writeUUID = 'abcd0001-0000-1000-8000-00805f9b0131';
    
    // 🔥 CRITICAL: ONLY temperature notification enabled
    // All others are DISABLED for testing
    const notifyUUIDs = [
      'abcd0002-0000-1000-8000-00805f9b0131'  // ONLY temperature
      // 'abcd0004-0000-1000-8000-00805f9b0131',  // DISABLED: target temp
      // 'abcd2a19-0000-1000-8000-00805f9b0131',  // DISABLED: battery
      // 'abcd1001-0000-1000-8000-00805f9b0131',  // DISABLED: file transfer
      // 'abcd1002-0000-1000-8000-00805f9b0131'   // DISABLED: file list
    ];

    const notifyDisplayMap = {
      'abcd0002-0000-1000-8000-00805f9b0131': 'currentTemp'
    };

    function switchLang(lang) {
      currentLang = lang;
      document.title = LANGS[lang].title;
      document.getElementById('mainTitle').textContent = LANGS[lang].title;
      document.getElementById('labelCurrentTemp').textContent = LANGS[lang].currentTemp;
      document.getElementById('labelTargetTemp').textContent = LANGS[lang].targetTemp + " (disabled)";
      document.getElementById('labelBatteryLevel').textContent = LANGS[lang].batteryLevel + " (disabled)";
      document.getElementById('tempInput').placeholder = LANGS[lang].setTemp;
      document.getElementById('btnWriteTemp').textContent = LANGS[lang].writeTemp;
      document.getElementById('btnConnect').textContent = LANGS[lang].connect;
      document.getElementById('footerText').textContent = LANGS[lang].footer;
      document.getElementById('debugTitle').textContent = LANGS[lang].debugTitle;
      document.getElementById('btnClearDebug').textContent = LANGS[lang].clearLog;
      document.getElementById('langSelect').value = lang;
      
      const statusText = document.getElementById('connectionStatusText');
      if (statusText) {
        statusText.textContent = isConnected ? LANGS[lang].connected : LANGS[lang].disconnected;
      }
    }

    function addDebugLog(message) {
      const debugLog = document.getElementById('debugLog');
      const now = new Date();
      const timeString = now.toTimeString().split(' ')[0] + '.' + now.getMilliseconds().toString().padStart(3, '0');
      const logEntry = document.createElement('div');
      logEntry.className = 'debug-entry';
      logEntry.innerHTML = `<span class="debug-time">[${timeString}]</span> ${message}`;
      debugLog.appendChild(logEntry);
      debugLog.scrollTop = debugLog.scrollHeight;
      
      // Also log to console for external debugging
      console.log(`[${timeString}] ${message}`);
    }

    function clearDebugLog() {
      document.getElementById('debugLog').innerHTML = '';
      addDebugLog('Debug log cleared');
    }

    function updateConnectionStatus(connected, errorMsg = null) {
      isConnected = connected;
      const indicator = document.getElementById('statusIndicator');
      const statusText = document.getElementById('connectionStatusText');
      
      if (connected) {
        indicator.className = 'status-indicator status-connected';
        statusText.textContent = LANGS[currentLang].connected;
        const duration = connectionStartTime ? ((Date.now() - connectionStartTime) / 1000).toFixed(1) : '?';
        addDebugLog(`✅✅✅ CONNECTION SUCCESSFUL! Duration: ${duration}s ✅✅✅`);
        addDebugLog(`📊 This proves Bluefy CAN maintain a connection with minimal characteristics`);
      } else {
        indicator.className = 'status-indicator status-disconnected';
        statusText.textContent = LANGS[currentLang].disconnected;
        const duration = connectionStartTime ? ((Date.now() - connectionStartTime) / 1000).toFixed(1) : '?';
        addDebugLog(`❌❌❌ DISCONNECTED after ${duration}s ❌❌❌`);
        if (errorMsg) {
          addDebugLog(`Error: ${errorMsg}`);
        }
      }
    }

    function parseFixedPointTemp(value) {
      const raw = value.getUint8(0) | (value.getUint8(1) << 8);
      return raw * 0.1;
    }

    async function connectBluetooth() {
      addDebugLog('========================================');
      addDebugLog('🧪 MINIMAL TEST MODE STARTING');
      addDebugLog(`📡 Only characteristic: ${notifyUUIDs[0]}`);
      addDebugLog('========================================');
      
      try {
        addDebugLog('Step 1: Requesting Bluetooth device...');
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [serviceUUID]
        });

        addDebugLog(`✅ Device found: ${device.name || 'Unknown'}`);
        addDebugLog('Step 2: Connecting to GATT server...');
        
        connectionStartTime = Date.now();
        const server = await device.gatt.connect();
        addDebugLog(`✅ GATT connected (elapsed: ${(Date.now() - connectionStartTime)/1000}s)`);
        
        addDebugLog('Step 3: Getting primary service...');
        const service = await server.getPrimaryService(serviceUUID);
        addDebugLog(`✅ Service found: ${serviceUUID}`);
        
        addDebugLog('Step 4: Getting characteristics...');
        const characteristics = await service.getCharacteristics();
        addDebugLog(`Found ${characteristics.length} total characteristics`);
        
        let writeFound = false;
        let notifyFound = false;
        
        for (const char of characteristics) {
          const uuid = char.uuid;
          addDebugLog(`  - Characteristic: ${uuid}`);
          
          if (uuid === writeUUID) {
            writeCharacteristic = char;
            writeFound = true;
            addDebugLog(`    ✅ WRITE characteristic found`);
            continue;
          }
          
          if (notifyUUIDs.includes(uuid)) {
            addDebugLog(`    🔔 Enabling notifications for: ${uuid}`);
            try {
              await char.startNotifications();
              addDebugLog(`    ✅ Notifications ENABLED for ${uuid}`);
              notifyFound = true;
              
              char.addEventListener('characteristicvaluechanged', (event) => {
                const value = event.target.value;
                const uuid = event.target.uuid;
                temperatureUpdateCount++;
                
                if (uuid === 'abcd0002-0000-1000-8000-00805f9b0131') {
                  const tempVal = parseFixedPointTemp(value);
                  const parsed = tempVal.toFixed(1) + ' °C';
                  document.getElementById('currentTemp').textContent = parsed;
                  addTempPoint(tempVal);
                  addDebugLog(`🌡️ Temperature update #${temperatureUpdateCount}: ${parsed}`);
                }
              });
            } catch (err) {
              addDebugLog(`    ❌ Failed to enable notifications for ${uuid}: ${err}`);
            }
          } else {
            // Log other characteristics but don't enable them
            addDebugLog(`    ⏭️ Skipping (not in enabled list): ${uuid}`);
          }
        }
        
        if (!writeFound) {
          addDebugLog(`❌ ERROR: Write characteristic ${writeUUID} not found!`);
          updateConnectionStatus(false, 'Write characteristic missing');
          return;
        }
        
        if (!notifyFound) {
          addDebugLog(`⚠️ WARNING: No notification characteristics were enabled (expected: ${notifyUUIDs[0]})`);
        }
        
        addDebugLog('========================================');
        addDebugLog('✅✅✅ CONNECTION ESTABLISHED SUCCESSFULLY ✅✅✅');
        addDebugLog(`📊 Active characteristics: WRITE + ${notifyUUIDs.length} notification(s)`);
        addDebugLog(`⏱️ Connection time: ${(Date.now() - connectionStartTime)/1000} seconds`);
        addDebugLog('========================================');
        
        updateConnectionStatus(true);
        
        // Time sync (keep this as it's important)
        addDebugLog('Step 5: Syncing time to device...');
        try {
          const now = new Date();
          const year = now.getFullYear() - 2000;
          const month = now.getMonth() + 1;
          const day = now.getDate();
          const hours = now.getHours();
          const minutes = now.getMinutes();
          const seconds = now.getSeconds();
          const timeBuffer = new Uint8Array([year, month, day, hours, minutes, seconds]);
          await writeCharacteristic.writeValue(timeBuffer);
          addDebugLog(`✅ Time synced: ${year+2000}-${month}-${day} ${hours}:${minutes}:${seconds}`);
        } catch (err) {
          addDebugLog(`⚠️ Time sync failed: ${err} (non-critical)`);
        }
        
        // Monitor connection stability
        let lastHeartbeat = Date.now();
        const heartbeatInterval = setInterval(() => {
          if (isConnected) {
            const elapsed = (Date.now() - connectionStartTime) / 1000;
            const sinceLastUpdate = (Date.now() - lastHeartbeat) / 1000;
            if (temperatureUpdateCount > 0) {
              lastHeartbeat = Date.now();
            }
            addDebugLog(`💓 Connection alive: ${elapsed.toFixed(0)}s, Updates: ${temperatureUpdateCount}`);
          }
        }, 10000);
        
        device.addEventListener('gattserverdisconnected', () => {
          addDebugLog(`🔌 GATT server disconnected event received`);
          clearInterval(heartbeatInterval);
          updateConnectionStatus(false, 'GATT disconnected');
          
          // Calculate final stats
          const duration = (Date.now() - connectionStartTime) / 1000;
          addDebugLog(`📊 Final stats: Connected for ${duration.toFixed(1)} seconds, received ${temperatureUpdateCount} temperature updates`);
          
          if (temperatureUpdateCount > 0 && duration > 10) {
            addDebugLog(`🎉 SUCCESS! Connection stayed alive for ${duration.toFixed(1)}s with ${temperatureUpdateCount} updates!`);
            addDebugLog(`💡 This proves Bluefy CAN work with minimal characteristics.`);
            addDebugLog(`💡 The problem is one of the disabled characteristics.`);
          } else {
            addDebugLog(`❌ FAILURE: Connection dropped after ${duration.toFixed(1)}s with only ${temperatureUpdateCount} updates.`);
            addDebugLog(`💡 This suggests even a single characteristic has issues.`);
          }
        });
        
        addDebugLog('========================================');
        addDebugLog('🧪 TEST ACTIVE - Monitoring temperature updates');
        addDebugLog('⏱️ Connection should stay alive indefinitely');
        addDebugLog('❌ If disconnect occurs, check Bluefy/BLE logs');
        addDebugLog('========================================');
        
      } catch (error) {
        addDebugLog(`❌ CONNECTION FAILED: ${error.message || error}`);
        console.error("Connection failed:", error);
        updateConnectionStatus(false, error.message);
      }
    }

    async function writeTargetTemp() {
      const inputStr = document.getElementById('tempInput').value.trim();
      const inputNum = parseFloat(inputStr);

      if (isNaN(inputNum) || inputNum < 0 || inputNum > 99.9) {
        alert(LANGS[currentLang].alert);
        addDebugLog(`Temperature setting error: ${inputStr} (invalid range)`);
        return;
      }

      const intValue = Math.round(inputNum * 10);
      const encodedStr = intValue.toString().padStart(3, '0');
      const encoder = new TextEncoder();
      const data = encoder.encode(encodedStr);

      if (writeCharacteristic) {
        try {
          await writeCharacteristic.writeValue(data);
          addDebugLog(`✅ Temperature set: ${inputNum}°C (sent: ${encodedStr})`);
        } catch (err) {
          addDebugLog(`❌ Write failed: ${err}`);
        }
      } else {
        alert(LANGS[currentLang].notConnected);
        addDebugLog("Cannot write: not connected");
      }
    }

    // Chart.js setup
    let tempChart = null;
    let tempData = {
      labels: [],
      datasets: [{
        label: 'Temperature (°C)',
        data: [], 
        borderColor: '#3498db',
        backgroundColor: 'rgba(52,152,219,0.08)',
        tension: 0.2,
        pointRadius: 2,
        fill: true
      }]
    };

    function initTempChart() {
      const ctx = document.getElementById('tempChart').getContext('2d');
      tempChart = new Chart(ctx, {
        type: 'line',
        data: tempData,
        options: {
          responsive: true,
          plugins: {
            legend: { display: false }
          },
          scales: {
            x: {
              type: 'time',
              time: { unit: 'minute', tooltipFormat: 'HH:mm:ss' },
              title: { display: true, text: 'Time' }
            },
            y: {
              title: { display: true, text: 'Temperature (°C)' },
              suggestedMin: 0,
              suggestedMax: 50
            }
          }
        }
      });
    }

    function addTempPoint(temp) {
      if (!tempChart) return; 
      const now = new Date();
      tempData.labels.push(now);
      tempData.datasets[0].data.push(temp);
      if (tempData.labels.length > 60) {
        tempData.labels.shift();
        tempData.datasets[0].data.shift();
      }
      tempChart.update();
    }

    // Initialize
    switchLang(currentLang);
    window.addEventListener('DOMContentLoaded', () => {
      initTempChart();
      addDebugLog('=== MINIMAL TEST MODE LOADED ===');
      addDebugLog(`📡 Enabled characteristics: ${notifyUUIDs.join(', ')}`);
      addDebugLog('🎯 Expected behavior: Connection stays alive, temperature updates arrive');
      addDebugLog('❌ If disconnect occurs, the issue is fundamental to Bluefy');
      addDebugLog('✅ If stays connected, add characteristics one by one to find the culprit');
    });
  </script>
</body>
</html>
